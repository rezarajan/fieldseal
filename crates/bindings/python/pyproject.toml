[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "fieldseal"
description = "Fieldseal core bindings for authority-side tools"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]

# maturin's automatic SBOM embeds a random serial number, a timestamp and
# absolute build paths, which makes the wheel irreproducible and leaks the
# builder's home directory. A deterministic SBOM is a follow-up (docs/explanation/build-system.md, "Reproducibility").
[tool.maturin.sbom]
rust = false
