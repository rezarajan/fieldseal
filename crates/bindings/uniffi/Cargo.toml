[package]
name = "fieldseal-uniffi"
description = "UniFFI bindings of the Fieldseal core for platform runtimes (Kotlin, Swift)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fieldseal_uniffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
fieldseal-kernel.workspace = true
thiserror.workspace = true
uniffi = { version = "0.32.2", features = ["cli"] }
