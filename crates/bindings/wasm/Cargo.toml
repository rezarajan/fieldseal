[package]
name = "fieldseal-wasm"
description = "The Fieldseal core compiled to WebAssembly for the browser device and the instrument workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fieldseal-kernel.workspace = true
fieldseal-instrument.workspace = true
fieldseal-adapters-authoring.workspace = true
fieldseal-adapters-html.workspace = true
fieldseal-adapters-web.workspace = true
fieldseal-trust.workspace = true
fieldseal-policy.workspace = true
fieldseal-publishing.workspace = true
fieldseal-registration.workspace = true
fieldseal-distribution.workspace = true
fieldseal-collection.workspace = true
fieldseal-delivery.workspace = true
fieldseal-intake.workspace = true
fieldseal-adapters-memory.workspace = true
# Pinned to the wasm-bindgen-cli in the flake's nixpkgs (the two must match exactly).
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
