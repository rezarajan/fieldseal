[package]
name = "fieldseal-kernel"
description = "Fieldseal shared kernel: identifiers, value types and the wire-format core every bounded context agrees on"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
hpke.workspace = true
icu_locale_core = { workspace = true, features = ["alloc"] }
p256.workspace = true
rand_core.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Cross-checks the hand-written Reed–Solomon code (parity.rs); not linked into the library.
reed-solomon-erasure = { version = "6.0", default-features = false }
serde_json = "1"

[lints]
workspace = true
