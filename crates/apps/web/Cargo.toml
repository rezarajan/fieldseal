[package]
name = "fieldseal-web"
description = "The Fieldseal showcase web app: instrument viewer, live evaluation and links to the other services (development only)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fieldseal_web"
path = "src/lib.rs"

[[bin]]
name = "fieldseal-web"
path = "src/main.rs"

[dependencies]
fieldseal-kernel.workspace = true
fieldseal-instrument.workspace = true
fieldseal-adapters-authoring.workspace = true
fieldseal-adapters-file.workspace = true
fieldseal-distribution.workspace = true
fieldseal-adapters-html.workspace = true
fieldseal-adapters-web.workspace = true
fieldseal-publishing.workspace = true
fieldseal-adapters-translog.workspace = true
fieldseal-trust.workspace = true
fieldseal-policy.workspace = true
serde_json = "1"
tiny_http = "0.12"
# The blocking client the other HTTP adapters use; https upstreams go through rustls.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
fieldseal-adapters-web = { workspace = true }
# The tests build a publishing world in memory.
fieldseal-adapters-memory.workspace = true

[lints]
workspace = true
