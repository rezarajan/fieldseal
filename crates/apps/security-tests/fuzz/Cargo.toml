# Manual cargo-fuzz harness (not part of the workspace, not run in CI). See README.md.
[package]
name = "fieldseal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fieldseal-security-tests = { path = ".." }

[[bin]]
name = "decoders"
path = "fuzz_targets/decoders.rs"
test = false
doc = false
bench = false

[workspace]
