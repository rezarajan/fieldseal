[package]
name = "fieldseal-dev-idp"
description = "A development-only OpenID Connect provider that stands where Keycloak stands in `just web`: discovery, authorization with PKCE, token and JWKS, ES256 tokens, fixed logins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fieldseal_dev_idp"
path = "src/lib.rs"

[[bin]]
name = "fieldseal-dev-idp"
path = "src/main.rs"

[dependencies]
fieldseal-kernel.workspace = true
fieldseal-adapters-authoring.workspace = true
p256.workspace = true
# The discovery, certs and token documents.
serde_json = "1"
# The four routes, served by the same small HTTP server the other services use.
tiny_http = "0.12"
# Authorization codes, token ids and the signing key come from the operating system's CSPRNG.
getrandom = "0.2"
# HTTP Basic client credentials at the token endpoint.
base64 = "0.22"

[dev-dependencies]
fieldseal-registration.workspace = true
# The production OIDC client, driven against this provider end to end.
fieldseal-adapters-oidc = { path = "../../adapters/oidc" }
ureq = { version = "3.5", default-features = false }
# An assignment made over the factory's HTTP API, then a registration, over the in-memory ports.
fieldseal-adapters-factory-http = { path = "../../adapters/factory-http" }
fieldseal-adapters-memory.workspace = true
fieldseal-policy.workspace = true

[lints]
workspace = true
