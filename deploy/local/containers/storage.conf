# Rootless storage. The roots come from XDG_DATA_HOME (tools/stack-engine.sh sets it to a
# directory of its own, ~/.local/share/fieldseal-podman), so nothing else's images are touched.
[storage]
driver = "overlay"

[storage.options.overlay]
# Native rootless overlay (kernel 5.13 and later); no fuse-overlayfs needed.
mount_program = ""
