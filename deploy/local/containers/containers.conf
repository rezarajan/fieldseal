# Rootless Podman from Nix, for the local stack (tools/stack-engine.sh points CONTAINERS_CONF here).
# There is no /etc/containers on such a host, so everything Podman needs is stated here.
[containers]
log_driver = "k8s-file"
# No systemd user session is assumed.
cgroups = "enabled"
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
network_cmd_path = ""
