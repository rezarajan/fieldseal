# Presentation only (ADR 0033), in the compact dialect (ADR 0040): partitions the survey, never reorders it.
layout: {name: household-water-access-compact, instrument: ../instrument.yaml, window: compact}
steps:
- id: household
  title: The household
  contents:
  - {element: welcome}
  - card:
      id: who-lives-here
      title: Who lives here
      contents:
      - show: [household.members, household.repaired_on]
- id: water
  title: Water
  navigation: free
  contents:
  - card:
      id: the-source
      title: The source
      contents:
      - show: [water.source, water.minutes_to_source]
  - card:
      id: use-and-treatment
      title: Use and treatment
      contents:
      - show: [water.litres_per_day, water.treatments]
  - card:
      id: cost
      title: Cost
      contents:
      - {element: water.monthly_cost}
- id: sanitation-and-hygiene
  title: Sanitation and hygiene
  contents:
  - card:
      id: the-toilet
      title: The toilet
      contents:
      - {group: sanitation}
  - card:
      id: hygiene
      title: Hygiene
      contents:
      - {group: hygiene}
  - {element: thanks}
