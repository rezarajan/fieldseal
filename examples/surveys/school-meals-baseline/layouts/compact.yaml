- id: counted-beans-and-lentils
  title: Beans and lentils
  navigation: free
  contents:
  - show: [diet.counted.plate.beans_and_lentils.freq, diet.counted.plate.beans_and_lentils.amount, diet.counted.plate.beans_and_lentils.yesterday]
- id: counted-other-name
  title: Name the food
  navigation: free
  contents:
  - show: [diet.counted.plate.other.other]
- id: counted-other
  title: Another food
  navigation: free
  contents:
  - show: [diet.counted.plate.other.freq, diet.counted.plate.other.amount, diet.counted.plate.other.yesterday]
- id: weighed-meat-and-fish
  title: Meat and fish
  navigation: free
  contents:
  - show: [diet.weighed.extras.meat_and_fish.freq, diet.weighed.extras.meat_and_fish.amount, diet.weighed.extras.meat_and_fish.yesterday]
- id: weighed-nuts
  title: Nuts
  navigation: free
  contents:
  - show: [diet.weighed.extras.nuts.freq, diet.weighed.extras.nuts.amount, diet.weighed.extras.nuts.yesterday]
- id: weighed-milk-and-yoghurt
  title: Milk and yoghurt
  navigation: free
  contents:
  - show: [diet.weighed.extras.milk_and_yoghurt.freq, diet.weighed.extras.milk_and_yoghurt.amount, diet.weighed.extras.milk_and_yoghurt.yesterday]
- id: weighed-sweets
  title: Sweets
  navigation: free
  contents:
  - show: [diet.weighed.extras.sweets.freq, diet.weighed.extras.sweets.amount, diet.weighed.extras.sweets.yesterday]
- id: weighed-snacks
  title: Snacks
