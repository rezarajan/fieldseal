# Presentation only (ADR 0033), in the compact dialect (ADR 0040): partitions the survey, never reorders it.
# A compact window is a phone, so each step shows at most four questions and fits the screen
# without scrolling (INS-210): the about-the-pupil questions are split into short steps, and each
# food is a step of its own, placed by its questions. The two lines that introduce the foods
# have a step to themselves, so that no food step is taller than a phone screen.
layout: {name: school-meals-baseline-compact, instrument: ../instrument.yaml, window: compact}
steps:
- id: who
  title: Who
  contents:
  - show: [about.school, about.name, about.class, about.age]
- id: sex
  title: Sex
  contents:
  - show: [about.sex]
- id: weight
  title: Weight
  contents:
  - show: [about.weight]
- id: height
  title: Height
  contents:
  - show: [about.height]
- id: school-shop
  title: School shop
  contents:
  - show: [about.uses_shop, about.shop_weekly]
- id: shop-items
  title: At the shop
  contents:
  - show: [about.shop_buys]
- id: school-meals
  title: School meals
  contents:
  - show: [about.meal_programme, about.meal_which]
- id: foods-and-drinks
  title: Foods and drinks
  navigation: free
  contents:
  - show: [diet.diet_intro, diet.diet_instructions]
- id: counted-bread-and-cereals
  title: Bread and cereals
  navigation: free
  contents:
  - show: [diet.counted.plate.bread_and_cereals.freq, diet.counted.plate.bread_and_cereals.amount, diet.counted.plate.bread_and_cereals.yesterday]
- id: counted-rice-and-pasta
  title: Rice and pasta
  navigation: free
  contents:
  - show: [diet.counted.plate.rice_and_pasta.freq, diet.counted.plate.rice_and_pasta.amount, diet.counted.plate.rice_and_pasta.yesterday]
- id: counted-vegetables
  title: Vegetables
  navigation: free
  contents:
  - show: [diet.counted.plate.vegetables.freq, diet.counted.plate.vegetables.amount, diet.counted.plate.vegetables.yesterday]
- id: counted-fruit
  title: Fruit
  navigation: free
  contents:
