# Clearing at any time with the PIN entered twice (ADR 0029), for
# `fieldseal device simulate --scenario clear` (also `--scenario lifecycle`).
#
# Covers: a clear cancelled by mismatched PIN entries, which counts toward lockout
# (COL-101); a clear before any receipt that keeps every sealed copy (COL-105, COL-106); a
# receipt that then deletes the cleared frames without prompting (COL-106) and leaves the
# journal verifiable from the checkpoint (COL-107); a reboot whose ticks continue from the
# high-water mark (COL-080); locking and unlocking; and closing the tenancy (COL-006).
pin: "246810"
seed: 9
survey: ../surveys/household-water-access
layouts: []
rosters:
  - cohort: village-b
    version: 1
    subjects:
      - { subject: h-101, consent: granted, display: { head_name: Dario }, attributes: {} }
      - { subject: h-102, consent: granted, display: { head_name: Elsa }, attributes: {} }
steps:
  - capture:
      subject: h-101
      mode: first
      set: { household.members: 3, water.source: piped_in_dwelling, water.litres_per_day: 200 }
      nonresponse: { water.monthly_cost: dont-know }
      acknowledge: true
      then: seal
  - status: { subject: h-102, outcome: absent }
  - clear: { through: 5, pins: ["246810", "246811"] }
    expect: clear cancelled
  - clear: { through: 5 }
  - review: {}
  - lock: {}
  - reboot: {}
  - unlock: {}
  - receipt: { through: 5 }
  - status: { subject: h-102, outcome: not-them }
  - review: {}
  - close: {}
