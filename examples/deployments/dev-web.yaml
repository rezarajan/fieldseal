# The manifest of `just web` (tools/dev-web.sh, docs/how-to/use-the-web-app.md): the services
# that run natively, without containers. Like local-stack.yaml, but the directories are under
# deploy/local/.state/dev-web/ (relative to the repository root, where tools/dev-web.sh starts
# every process), the processes bind 127.0.0.1, and the factory signs in through the production `oidc`
# adapter against the development IdP (crates/apps/dev-idp), which tools/dev-web.sh starts on
# localhost:8180, the issuer the stack's Keycloak uses. The development IdP is a tool, not a
# component, so no manifest names it. Secrets appear only as `{ secretRef: <name> }`;
# tools/dev-web.sh generates them into deploy/local/.state/dev-web/secrets.
#
#   fieldseal deployment validate examples/deployments/dev-web.yaml
#   fieldseal deployment render examples/deployments/dev-web.yaml --environment development --out deploy/local/.state/dev-web/env
apiVersion: fieldseal.dev/v1alpha1
kind: Deployment
metadata:
  name: dev-web
  schemaVersion: 1.0.0
spec:
  authority:
    displayName: Dev Web Authority
    trustBundle: { ref: trust/development-root, channel: development }
  registries:
    artefacts: { url: "http://localhost:9000", transparencyLog: "http://localhost:9001" }
    builds: { container: "localhost/fieldseal", runtime: "http://localhost:9002" }
  policies:
    layers:
      - { ref: policy/deployment-default, digest: "sha256:78daf4a0c4ca30aec1aa86e6f7b868a86ed73f74bfde7c3c1a8c644024fc9266" }
  instruments:
    - { ref: instrument/school-meals-baseline, channel: development }
    - { ref: instrument/household-water-access, channel: development }
  components:
    factory:
      bind: "127.0.0.1:8080"
      adapters:
        # The same adapter and settings as the stack, against the development IdP.
        IdentityProvider:
          adapter: oidc
          config:
            issuer: "http://localhost:8180/realms/fieldseal"
            clientId: fieldseal-factory
            clientSecret: { secretRef: factory-oidc-client-secret }
            acrValues: phr
            rolesClaim: roles
            # The operator API: access tokens of the public client fieldseal-cli for this audience.
            # The development IdP issues the header type at+jwt, so acceptTypJwt stays off.
            apiAudience: fieldseal-factory-api
            cliClientId: fieldseal-cli
        # The authority that tools/stack-init.sh creates (development custody: files).
        Signer:
          adapter: file-dev
          config:
            dir: deploy/local/.state/dev-web/authority/online
            trustBundle: deploy/local/.state/dev-web/authority/trust-bundle.bundle
        # The render writes FIELDSEAL_ALLOW_UNATTESTED=true for this adapter (REG-017, non-production only).
        AttestationVerifier: { adapter: software, config: {} }
        # The release policy (`deployment-policy`) is verified against these before any value is read
        # from it. Outside development the factory takes `policyDigest` instead: the content address
        # of the policy it trusts.
        PolicyEngine:
          adapter: built-in
          config:
            allowedBuilders: "https://ci.example.org/builders/fieldseal-publish"
            allowedSources: "https://git.example.org/authority/artefacts"
        # Cohorts reach a tenancy through `fieldseal roster assign`, which the journal records.
        TenancyRegistry: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/factory } }
        # The artefact registry `just publish` writes (read here) and the roster store that
        # `fieldseal roster issue` writes through the factory. Both are development adapters.
        # `scanIntervalS` lets the factory notice a publication within two seconds.
        ArtefactRegistry: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/cli/registry, scanIntervalS: 2 } }
        RosterSource: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/rosters } }
        # The bundles the factory builds and the rosters it issued (read by intake), and the
        # runtime profiles, which live in the tenancy registry's directory.
        BundleStore: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/bundles, issuedRostersDir: deploy/local/.state/dev-web/issued } }
        RuntimeProfiles: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/factory } }
      scaling: { replicas: 1 }
    # `just web` runs the intake app natively. Its results reader signs in at the development IdP
    # as the factory does, with the client `fieldseal-intake`.
    intake:
      bind: "127.0.0.1:8480"
      publicUrl: "http://localhost:8480"
      portal: { bind: "127.0.0.1:8481", publicUrl: "http://localhost:8481" }
      dirs: { exportKey: deploy/local/.state/dev-web/authority/export-key }
      adapters:
        IdentityProvider:
          adapter: oidc
          config:
            issuer: "http://localhost:8180/realms/fieldseal"
            clientId: fieldseal-intake
            clientSecret: { secretRef: intake-oidc-client-secret }
            acrValues: phr
            rolesClaim: roles
        RecordKeyUnsealer:
          adapter: file-dev
          config: { dir: deploy/local/.state/dev-web/authority/online, trustBundle: deploy/local/.state/dev-web/authority/trust-bundle.bundle }
        SubmissionStore: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/submissions } }
        RosterHistory: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/issued } }
        InstrumentSource: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/published } }
        DataPlatform: { adapter: landing-files, config: { dir: deploy/local/.state/dev-web/landing } }
        PolicyEngine:
          adapter: built-in
          config:
            allowedBuilders: "https://ci.example.org/builders/fieldseal-publish"
            allowedSources: "https://git.example.org/authority/artefacts"
        TenancyRegistry: { adapter: file-dev, config: { dir: deploy/local/.state/dev-web/factory } }
      scaling: { replicas: 1 }
    publishing:
      bind: "127.0.0.1:9001"
      adapters:
        TransparencyLog:
          adapter: translog
          config:
            origin: "fieldseal.local/log"
            dir: deploy/local/.state/dev-web/log
            keyFile: deploy/local/.state/dev-web/authority/translog.key
        # The log signs its checkpoints with the key in `keyFile` (a development adapter).
        Signer: { adapter: file-dev, config: {} }
  runtime:
    provisioning:
      factoryUrl: "http://localhost:8080"
      destinationUrl: "http://localhost:8480"
      platforms:
        android: { management: self-managed, deviceOwner: fieldseal, lockTask: false }
  environments:
    development: {}
