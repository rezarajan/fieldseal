# The manifest of the local compose stack (deploy/local, docs/how-to/run-the-local-stack.md): the
# factory with a real OIDC sign-in against a local Keycloak that requires passkeys, the intake
# upload endpoint (bound to the same authority as the factory) and the self-hosted transparency
# log. `just up` renders it to one env file per service; the services read nothing else (DEP-012).
#
# Nothing here may run in production: the keys are files in a directory (development custody),
# the factory's state is a local journal, and `fieldseal deployment validate` refuses these
# adapters in an environment named `production` (DEP-023).
# Secrets appear only as `{ secretRef: <name> }`; a local `.env.secrets` (git-ignored,
# generated by `just up`) supplies them at run time.
#
#   fieldseal deployment validate examples/deployments/local-stack.yaml
#   fieldseal deployment render examples/deployments/local-stack.yaml --environment development --out deploy/local/.generated
#
# All URLs are the ones a browser and the host use, on `localhost`: a browser accepts passkeys
# only for a domain name (never an IP address), and plain http only for localhost. Inside the
# compose network the factory shares the identity provider's network namespace, so that the
# issuer URL the browser uses is also the one the factory reaches (deploy/local/compose.yaml).
apiVersion: fieldseal.dev/v1alpha1
kind: Deployment
metadata:
  name: local-stack
  schemaVersion: 1.0.0
spec:
  authority:
    displayName: Local Stack Authority
    trustBundle: { ref: trust/development-root, channel: development }
  registries:
    artefacts: { url: "http://localhost:9000", transparencyLog: "http://localhost:9001" }
    builds: { container: "localhost/fieldseal", runtime: "http://localhost:9002" }
  policies:
    layers:
      - { ref: policy/deployment-default, digest: "sha256:78daf4a0c4ca30aec1aa86e6f7b868a86ed73f74bfde7c3c1a8c644024fc9266" }
  instruments:
    - { ref: instrument/school-meals-baseline, channel: development }
    - { ref: instrument/household-water-access, channel: development }
  components:
    factory:
      bind: "0.0.0.0:8080"
      adapters:
        IdentityProvider:
          adapter: oidc
          config:
            issuer: "http://localhost:8180/realms/fieldseal"
            clientId: fieldseal-factory
            clientSecret: { secretRef: factory-oidc-client-secret }
            # Ask for a phishing-resistant sign-in (Keycloak: level of authentication 2).
            # Asking proves nothing: only the ID token's own acr/amr count (REG-002a).
            acrValues: phr
            rolesClaim: roles
            # The operator API (roster issue, roster assign): access tokens of the public client
            # fieldseal-cli for this audience. Keycloak's access tokens carry the header type JWT.
            apiAudience: fieldseal-factory-api
            cliClientId: fieldseal-cli
            acceptTypJwt: true
        # One authority for the whole stack: the keys and the trust bundle that the `init`
        # service created (development custody: files, never production).
        Signer:
          adapter: file-dev
          config: { dir: /authority/online, trustBundle: /authority/trust-bundle.bundle }
        AttestationVerifier: { adapter: software, config: {} }
        # The release policy (`deployment-policy`) is verified against these before any value is read
        # from it. Outside development the factory takes `policyDigest` instead: the content address
        # of the policy it trusts.
        PolicyEngine:
          adapter: built-in
          config:
            allowedBuilders: "https://ci.example.org/builders/fieldseal-publish"
            allowedSources: "https://git.example.org/authority/artefacts"
        # Tokens, accounts, tenancies and devices are kept in a journal, so a restart keeps them.
        # Cohorts reach a tenancy through `fieldseal roster assign`, which the journal records.
        TenancyRegistry: { adapter: file-dev, config: { dir: /state/factory } }
        # The artefact registry `artefact publish` writes (read here) and the roster store that
        # `roster issue` writes through the factory. Both are development adapters.
        # `scanIntervalS` is how often the factory looks for new publications; the demo waits
        # for it once between publishing and the first bundle.
        ArtefactRegistry: { adapter: file-dev, config: { dir: /clistate/registry, scanIntervalS: 2 } }
        RosterSource: { adapter: file-dev, config: { dir: /rosters } }
        # The factory builds each registered device's bundle into `dir` and records the rosters
        # it issues in `issuedRostersDir`, which intake reads. It reads the schema versions a
        # device reported at registration from the same journal as the tenancy registry.
        BundleStore: { adapter: file-dev, config: { dir: /bundles, issuedRostersDir: /issued } }
        RuntimeProfiles: { adapter: file-dev, config: { dir: /state/factory } }
      scaling: { replicas: 1 }
    intake:
      # Both listeners are on all interfaces: the service shares Keycloak's network namespace.
      bind: "0.0.0.0:8480"
      publicUrl: "http://localhost:8480"
      portal: { bind: "0.0.0.0:8481", publicUrl: "http://localhost:8481" }
      dirs: { exportKey: /authority/export-key }
      adapters:
        # The results reader signs in at the same Keycloak as the factory portal.
        IdentityProvider:
          adapter: oidc
          config:
            issuer: "http://localhost:8180/realms/fieldseal"
            clientId: fieldseal-intake
            clientSecret: { secretRef: intake-oidc-client-secret }
            acrValues: phr
            rolesClaim: roles
        # The stack's authority (the same keys and bundle as the factory) and the factory's
        # tenancies, read from its state directory (mounted read-only).
        RecordKeyUnsealer:
          adapter: file-dev
          config: { dir: /authority/online, trustBundle: /authority/trust-bundle.bundle }
        # Accepted submissions are kept, and run through the gate again at start-up (INT-013a).
        SubmissionStore: { adapter: file-dev, config: { dir: /submissions } }
        # The rosters the factory issued (read-only), for the consent checks.
        RosterHistory: { adapter: file-dev, config: { dir: /issued } }
        InstrumentSource: { adapter: file-dev, config: { dir: /published } }
        DataPlatform: { adapter: landing-files, config: { dir: /landing } }
        # The publishing policy that instruments are verified under (Technical Plan 8):
        # comma-separated lists.
        PolicyEngine:
          adapter: built-in
          config:
            allowedBuilders: "https://ci.example.org/builders/fieldseal-publish"
            allowedSources: "https://git.example.org/authority/artefacts"
        TenancyRegistry: { adapter: file-dev, config: { dir: /factory-state } }
      scaling: { replicas: 1 }
    publishing:
      bind: "0.0.0.0:8080"
      adapters:
        TransparencyLog:
          adapter: translog
          config:
            origin: "fieldseal.local/log"
            dir: /data/log
            keyFile: /authority/translog.key
        Signer: { adapter: memory, config: {} }
  runtime:
    provisioning:
      factoryUrl: "http://localhost:8080"
      destinationUrl: "http://localhost:8480"
      platforms:
        android: { management: self-managed, deviceOwner: fieldseal, lockTask: false }
  environments:
    development: {}
