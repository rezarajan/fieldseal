# The manifest of the local compose stack (deploy/local, docs/how-to/run-the-local-stack.md): the
# factory with a real OIDC sign-in against a local Keycloak that requires passkeys, the intake
# upload endpoint (bound to the same authority as the factory) and the self-hosted transparency
# log. `just up` renders it to one env file per service; the services read nothing else (DEP-012).
#
# Nothing here may run in production: the keys are files in a directory (development custody),
# the factory's state is a local journal, and `fieldseal deployment validate` refuses these
# adapters in an environment named `production` (DEP-023).
# Secrets appear only as `{ secretRef: <name> }`; a local `.env.secrets` (git-ignored,
# generated by `just up`) supplies them at run time.
#
#   fieldseal deployment validate examples/deployments/local-stack.yaml
#   fieldseal deployment render examples/deployments/local-stack.yaml --environment development --out deploy/local/.generated
#
# All URLs are the ones a browser and the host use, on `localhost`: a browser accepts passkeys
# only for a domain name (never an IP address), and plain http only for localhost. Inside the
# compose network the factory shares the identity provider's network namespace, so that the
# issuer URL the browser uses is also the one the factory reaches (deploy/local/compose.yaml).
apiVersion: fieldseal.dev/v1alpha1
kind: Deployment
metadata:
  name: local-stack
  schemaVersion: 1.0.0
spec:
  authority:
    displayName: Local Stack Authority
    trustBundle: { ref: trust/development-root, channel: development }
  registries:
    artefacts: { url: "http://localhost:9000", transparencyLog: "http://localhost:9001" }
    builds: { container: "localhost/fieldseal", runtime: "http://localhost:9002" }
  policies:
    layers:
      - { ref: policy/deployment-default, digest: "sha256:e2a2c86e21517b946eb84d13c5ec14bfe396227e2955a21fb0c842eef1b50dcb" }
  instruments:
    - { ref: instrument/food-intake-baseline, channel: development }
    - { ref: instrument/household-water-access, channel: development }
  components:
    factory:
      bind: "0.0.0.0:8080"
      adapters:
        IdentityProvider:
          adapter: oidc
          config:
            issuer: "http://localhost:8180/realms/fieldseal"
            clientId: fieldseal-factory
            clientSecret: { secretRef: factory-oidc-client-secret }
            # Ask for a phishing-resistant sign-in (Keycloak: level of authentication 2).
            # Asking proves nothing: only the ID token's own acr/amr count (REG-002a).
            acrValues: phr
            rolesClaim: roles
        # One authority for the whole stack: the keys and the trust bundle that the `init`
        # service created (development custody: files, never production).
        Signer:
          adapter: file-dev
          config: { dir: /authority/online, trustBundle: /authority/trust-bundle.bundle }
        AttestationVerifier: { adapter: software, config: {} }
        PolicyEngine: { adapter: built-in, config: {} }
        # Tokens, accounts, tenancies and devices are kept in a journal, so a restart keeps them.
        # Every new tenancy is assigned the cohorts of both sample rosters (food survey, water survey).
        TenancyRegistry: { adapter: file-dev, config: { dir: /state/factory, cohorts: "cohort-a:1,village-a:1" } }
      scaling: { replicas: 1 }
    intake:
      bind: "0.0.0.0:8480"
      adapters:
        # The stack's authority (the same keys and bundle as the factory) and the factory's
        # tenancies, read from its state directory (mounted read-only).
        RecordKeyUnsealer:
          adapter: file-dev
          config: { dir: /authority/online, trustBundle: /authority/trust-bundle.bundle }
        SubmissionStore: { adapter: memory, config: {} }
        DataPlatform: { adapter: landing-files, config: { dir: /landing } }
        PolicyEngine: { adapter: built-in, config: {} }
        TenancyRegistry: { adapter: file-dev, config: { dir: /factory-state } }
      scaling: { replicas: 1 }
    publishing:
      bind: "0.0.0.0:8080"
      adapters:
        TransparencyLog:
          adapter: translog
          config:
            origin: "fieldseal.local/log"
            dir: /data/log
            keyFile: /authority/translog.key
        Signer: { adapter: memory, config: {} }
  runtime:
    provisioning:
      factoryUrl: "http://localhost:8080"
      destinationUrl: "http://localhost:8480"
      platforms:
        android: { management: self-managed, deviceOwner: fieldseal, lockTask: false }
  environments:
    development: {}
