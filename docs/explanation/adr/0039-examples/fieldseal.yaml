# yaml-language-server: $schema=https://schemas.fieldseal.dev/authoring/1/source.schema.json
# The source manifest: names the files, the languages and where each language's wording lives.
apiVersion: fieldseal.dev/v1alpha1
kind: Source
metadata: { name: school-meals-baseline, version: 1.0.0 }
spec:
  schema: "^1.0"
  instrument: instrument.yaml
  layouts: [layouts/compact.yaml, layouts/expanded.yaml]
  i18n:
    default: en
    catalogues: i18n/{lang}/{domain}.po      # one directory per locale, one file per domain
    domains: [instrument, layouts]
    languages:
      en: {}
      es: { status: draft, method: human, reviewedBy: 2 }   # draft: not compiled until complete
